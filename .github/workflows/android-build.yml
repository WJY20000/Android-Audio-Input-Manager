name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:

# 同一分支的新提交自动取消还在跑的旧构建，省 Action 时长
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-android 当前下载的 Android command-line tools (sdkmanager) 需要 JDK 17。
      # Gradle 7.5 / AGP 7.4.2 可在 JDK 17 上运行；应用字节码仍由 app/build.gradle 保持 Java 11。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 安装 Android SDK 命令行工具，并按项目 compileSdk(34)
      # 自动安装对应的 platform 与 build-tools，同时自动接受 licenses
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 官方 Gradle 初始化：缓存 ~/.gradle（含 wrapper 分发包与构建缓存），
      # 并自动校验 gradle-wrapper.jar 的完整性
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload unit-test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
